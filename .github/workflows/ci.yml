name: CI

on:
  push:
    branches: [main]
  pull_request:

# Toute la suite tourne hors ligne, par construction : aucun test ne touche au
# réseau. Si un job avait besoin d'un secret pour passer, ce serait un bug du
# test, pas un secret manquant.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Rejoue une séquence écrite de trades et vérifie le capital, les arrêts,
      # la promotion d'une règle et sa rétrogradation. Attrape ce que les tests
      # unitaires laissent passer : le comportement du système bout en bout.
      - name: Simulation
        run: npm run simulation
